name: Build & Deploy to Hosting (FTP)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-ftp:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project for Hosting (Root Path)
        run: npm run build
        env:
          BUILD_FOR_PAGES: "false"

      - name: Deploy via FTP to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: /public_html/autoredactor.aplicatodos.com/
          dangerous-clean-slate: false